<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TK Space Pinball</title><style>*{box-sizing:border-box}body{margin:0;background:#070b19;color:#e9f6ff;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100dvh;overflow:hidden}main{height:100dvh;max-height:950px;display:flex;flex-direction:column;align-items:center;gap:6px}header{width:100%;display:flex;justify-content:space-between;padding:5px 12px;font-weight:800;font-size:14px}canvas{height:min(78dvh,790px);max-width:96vw;aspect-ratio:440/720;border:3px solid #5ce2fa;border-radius:22px;background:#0b112b;touch-action:none;box-shadow:0 0 25px #16b9f755}nav{width:100%;display:flex;gap:10px;justify-content:space-between;padding:0 6px}button{background:#18344e;border:2px solid #52d9ed;color:white;border-radius:14px;padding:13px 19px;font-size:16px;font-weight:800;touch-action:none;user-select:none}button:active{background:#247c9d}small{opacity:.7}</style></head><body><main><header><span>✦ TK SPACE PINBALL</span><span id="score">SCORE 000000</span><span id="balls">BALLEN 3</span></header><canvas id="game" width="440" height="720"></canvas><nav><button id="left">◀ FLIP</button><button id="start">START / RESET</button><button id="launch">LAUNCH ▲</button><button id="right">FLIP ▶</button></nav><small>Toetsen: ← → flippers · spatie lanceren</small></main><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),S=document.querySelector('#score'),B=document.querySelector('#balls');let score=0,balls=3,active=false,ready=true,over=false;const ball={x:400,y:638,vx:0,vy:0,r:8};const keys={l:false,r:false};const bumpers=[{x:135,y:205,r:30,col:'#ff5ac8'},{x:278,y:205,r:30,col:'#40eaff'},{x:207,y:306,r:27,col:'#ffce58'}];const posts=[{x:83,y:527,r:12},{x:344,y:527,r:12},{x:168,y:563,r:9},{x:259,y:563,r:9}];let last=performance.now();function reset(){score=0;balls=3;over=false;newBall();}function newBall(){active=false;ready=true;ball.x=400;ball.y=638;ball.vx=0;ball.vy=0;update()}function update(){S.textContent='SCORE '+String(score).padStart(6,'0');B.textContent='BALLEN '+balls}function launch(){if(over){reset();return}if(ready){ready=false;active=true;ball.vx=-3.1;ball.vy=-17.7}}function line(x1,y1,x2,y2,col='#72dffa',w=5){g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function collideCircle(o,restitution=1.07){let dx=ball.x-o.x,dy=ball.y-o.y,d=Math.hypot(dx,dy)||1,min=ball.r+o.r;if(d<min){let nx=dx/d,ny=dy/d;ball.x=o.x+nx*min;ball.y=o.y+ny*min;let v=ball.vx*nx+ball.vy*ny;if(v<0){ball.vx-=(1+restitution)*v*nx;ball.vy-=(1+restitution)*v*ny}if(o.col){ball.vx+=nx*2.4;ball.vy+=ny*2.4;score+=100;update()}}}function segment(x1,y1,x2,y2,bounce=0.86){let dx=x2-x1,dy=y2-y1,t=Math.max(0,Math.min(1,((ball.x-x1)*dx+(ball.y-y1)*dy)/(dx*dx+dy*dy))),px=x1+t*dx,py=y1+t*dy,nx=ball.x-px,ny=ball.y-py,d=Math.hypot(nx,ny)||1;if(d<ball.r+3){nx/=d;ny/=d;ball.x=px+nx*(ball.r+3);ball.y=py+ny*(ball.r+3);let v=ball.vx*nx+ball.vy*ny;if(v<0){ball.vx-=(1+bounce)*v*nx;ball.vy-=(1+bounce)*v*ny}}}function flipper(left){let pivot=left?157:273,y=629,angle=left?(keys.l?-.52:.38):(keys.r?Math.PI+.52:Math.PI-.38),endX=pivot+Math.cos(angle)*85,endY=y+Math.sin(angle)*85;segment(pivot,y,endX,endY,1.0);let dx=endX-pivot,dy=endY-y,t=Math.max(0,Math.min(1,((ball.x-pivot)*dx+(ball.y-y)*dy)/(dx*dx+dy*dy)));let dist=Math.hypot(ball.x-(pivot+dx*t),ball.y-(y+dy*t));if(dist<ball.r+12&&((left&&keys.l)||(!left&&keys.r))&&ball.y<y+18){ball.vy=Math.min(ball.vy,-(10+7*t));ball.vx+=(left?1:-1)*(2+5*t)}}function tick(dt){if(!active)return;let steps=Math.max(1,Math.ceil(dt*2));for(let i=0;i<steps;i++){let s=dt/steps;ball.vy+=.22*s;ball.x+=ball.vx*s;ball.y+=ball.vy*s;ball.vx*=Math.pow(.999, s);ball.vy*=Math.pow(.999,s);if(ball.x<ball.r+22){ball.x=ball.r+22;ball.vx=Math.abs(ball.vx)*.87}if(ball.x>432-ball.r){ball.x=432-ball.r;ball.vx=-Math.abs(ball.vx)*.88}if(ball.y<ball.r+23){ball.y=ball.r+23;ball.vy=Math.abs(ball.vy)*.85}segment(22,110,66,52);segment(66,52,365,52);segment(365,52,430,125);segment(22,110,22,550);segment(430,125,430,680);segment(22,550,124,628);segment(430,550,305,628);segment(83,491,153,558);segment(347,491,279,558);segment(68,363,116,401);segment(355,363,305,401);for(const o of bumpers)collideCircle(o,1.25);for(const o of posts)collideCircle(o);flipper(true);flipper(false);if(ball.y>735){balls--;if(balls<=0){over=true;active=false;ready=false;update()}else newBall();break}}}function draw(){g.clearRect(0,0,440,720);let bg=g.createLinearGradient(0,0,440,720);bg.addColorStop(0,'#182b5c');bg.addColorStop(1,'#060a1b');g.fillStyle=bg;g.fillRect(0,0,440,720);for(let i=0;i<65;i++){let x=(i*173+71)%430,y=(i*263+19)%700;circle(x,y,i%5===0?1.6:.7,'#b8d6ff88')}g.strokeStyle='#34cbe2';g.lineWidth=6;g.strokeRect(14,14,412,692);line(22,110,66,52);line(66,52,365,52);line(365,52,430,125);line(22,110,22,550);line(430,125,430,680);line(22,550,124,628,'#e46dd5',7);line(430,550,305,628,'#e46dd5',7);line(83,491,153,558,'#f1bb5e',8);line(347,491,279,558,'#f1bb5e',8);line(68,363,116,401,'#48d5fc');line(355,363,305,401,'#48d5fc');for(const o of bumpers){g.shadowColor=o.col;g.shadowBlur=23;circle(o.x,o.y,o.r+6,o.col);g.shadowBlur=0;circle(o.x,o.y,o.r-4,'#26325d');circle(o.x,o.y,8,'#e7faff')}for(const o of posts){circle(o.x,o.y,o.r,'#f7ca70');circle(o.x,o.y,4,'#fff')}for(const left of [true,false]){let p=left?157:273,a=left?(keys.l?-.52:.38):(keys.r?Math.PI+.52:Math.PI-.38);line(p,629,p+85*Math.cos(a),629+85*Math.sin(a),left?'#ff729e':'#57edfb',17);circle(p,629,12,'#f4f8ff')}g.font='bold 20px system-ui';g.textAlign='center';g.fillStyle='#8ee7ff';g.fillText('NEBULA • 01',220,108);g.font='12px system-ui';g.fillText('ORBITAL BONUS',220,133);g.strokeStyle='#e9b85d';g.lineWidth=2;g.strokeRect(384,550,32,133);if(ready){circle(ball.x,ball.y,ball.r,'#e8f7ff');g.font='bold 13px system-ui';g.fillText('LANCEER',354,685)}else if(active){g.shadowColor='#dffaff';g.shadowBlur=13;circle(ball.x,ball.y,ball.r,'#e8f7ff');g.shadowBlur=0;circle(ball.x-2,ball.y-3,3,'#fff')}if(over){g.fillStyle='#04091edb';g.fillRect(30,280,380,120);g.font='bold 35px system-ui';g.fillStyle='#fff';g.fillText('GAME OVER',220,336);g.font='17px system-ui';g.fillText('Druk op START',220,370)}}function frame(now){let dt=Math.min(2,(now-last)/16.667);last=now;tick(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);function hold(id,key){const e=document.getElementById(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();e.setPointerCapture(ev.pointerId);keys[key]=true});for(let event of ['pointerup','pointercancel','lostpointercapture'])e.addEventListener(event,()=>keys[key]=false)}hold('left','l');hold('right','r');document.querySelector('#launch').addEventListener('pointerdown',e=>{e.preventDefault();launch()});document.querySelector('#start').onclick=reset;window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft')keys.l=true;if(e.code==='ArrowRight')keys.r=true;if(e.code==='Space'&&!e.repeat)launch()});window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')keys.l=false;if(e.code==='ArrowRight')keys.r=false});</script></body></html>
